<!doctype html>
<html lang="ar" dir="rtl">

<title>المعلّم الرقمي محمد غنام</title><!-- مصمم لطفل بعمر ٧ سنوات: مهمة واحدة في الشاشة، لمس مباشر، تعليمات قصيرة -->
<style>
:root{
  --bg:#eef8ff;--card:#fff;--ink:#17324a;--muted:#61788d;--line:#dbe6ef;
  --gold:#f6c84b;--green:#178451;--green-soft:#ecfbf3;--red:#c64444;--red-soft:#fff1f1;
  --blue:#2e6fc8;--blue-soft:#edf5ff;--purple:#7651d4;--purple-soft:#f2edff
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 90% 0,#fff1b9 0,transparent 25%),
linear-gradient(180deg,#eaf7ff,#fffaf0 78%);color:var(--ink);
font-family:Tahoma,Arial,"Noto Sans Arabic",sans-serif}
body{direction:rtl;text-align:right}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #86bdf0;outline-offset:2px}button:disabled{opacity:.7}
.shell{max-width:760px;margin:auto;padding:10px 10px max(24px,env(safe-area-inset-bottom))}
.teacher{
 display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px
}
.teacher-badge{
 width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;
 background:linear-gradient(145deg,#1d4f7a,#2e78aa);color:#fff;box-shadow:0 6px 18px #1d4f7a33
}
.teacher .name{font-weight:900}.teacher .sub{font-size:13px;color:var(--muted)}.listen{margin-right:auto;border:0;background:#edf5ff;color:#245c9c;border-radius:999px;padding:9px 12px;font-weight:900}
.card{
 background:var(--card);border:1px solid #e6edf3;border-radius:26px;padding:16px;
 box-shadow:0 16px 42px rgba(23,50,74,.10)
}
.progress{height:11px;border-radius:99px;background:#e9eef3;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffbd32,#ffe078);transition:.25s}
h1{text-align:center;font-size:28px;margin:4px 0 7px}
.instruction{text-align:center;font-size:22px;line-height:1.75;font-weight:900;margin:0 0 13px;max-width:620px;margin-inline:auto}
.stage{min-height:320px}
.msg{min-height:42px;text-align:center;font-size:18px;font-weight:900;line-height:1.6;margin-top:10px}
.msg.ok{color:var(--green)}.msg.no{color:var(--red)}
.center{text-align:center}.hero{font-size:140px;font-weight:900;line-height:1;color:#ef743b;margin:10px 0}
.bigicon{font-size:55px;line-height:1.7}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.choice,.item,.primary,.secondary{
 min-height:82px;border:3px solid var(--line);border-radius:20px;background:#fff;color:var(--ink);
 padding:10px;font-weight:900
}
.choice{font-size:32px}.item{font-size:44px}.countBadge{display:inline-grid;place-items:center;min-width:58px;height:58px;border-radius:18px;background:#17324a;color:#fff;font-size:34px;font-weight:900;margin:8px auto}.rabbits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.rabbitSlot{border:2px solid #dbe6ef;border-radius:18px;padding:10px;text-align:center;font-size:36px;background:#fbfdff}.rabbitSlot.fed{background:#ecfbf3;border-color:#50b77a}.tapnote{text-align:center;font-size:16px;color:#61788d;margin:7px 0 10px}
.primary{width:100%;margin-top:12px;background:linear-gradient(#ffe584,#ffc747);border-color:#efbe43;color:#684400;font-size:20px}
.secondary{background:var(--blue-soft);border-color:#c9dcfb;color:#245c9c;font-size:17px}
.good{border-color:#50b77a!important;background:var(--green-soft)!important}
.bad{border-color:#e67a7a!important;background:var(--red-soft)!important}
.scene{border:2px dashed #ccdfed;background:#f9fcff;border-radius:22px;padding:14px}
.pool,.basket{min-height:108px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px}
.pool{background:#f8fbfd;border:2px dashed #d4dfe8;border-radius:20px;margin-bottom:10px}
.basket{background:#fff6e7;border:5px solid #b88349;border-top-width:10px;border-radius:18px}
.bridge{text-align:center;background:#fff7dc;border:2px solid #ffe18d;border-radius:22px;padding:16px}
.dots{font-size:58px;line-height:1.4}.word{font-size:32px;font-weight:900;margin:6px}
.hint{background:#f3f8fd;border-right:5px solid #77a9dd;border-radius:13px;padding:10px 12px;line-height:1.7;margin-top:10px}
.photo-box{border:2px solid #d8e4ee;border-radius:22px;background:#fbfdff;padding:14px;text-align:center}
.photo-box .camera{font-size:58px}.privacy{font-size:14px;line-height:1.7;color:var(--muted);margin:8px 0}
.photo-preview{max-width:100%;max-height:260px;border-radius:16px;margin-top:9px;display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions>*{flex:1}
.trace{height:300px;position:relative;border:2px dashed #ccd7e0;border-radius:20px;background:#fff;overflow:hidden;touch-action:none}
.trace .guide{position:absolute;inset:0;display:grid;place-items:center;font-size:215px;font-weight:900;color:#e1e8ee;user-select:none}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.alias{max-width:420px;margin:15px auto}
.alias input{
 width:100%;font-size:21px;border:2px solid #cad9e5;border-radius:17px;padding:13px 15px;text-align:center;outline:none
}
.alias input:focus{border-color:#679fd0;box-shadow:0 0 0 3px #dcecff}
.small{text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.done{text-align:center;font-size:25px;font-weight:900;line-height:1.9}
.offline{
 display:none;background:#fff1cf;color:#704d00;border-radius:12px;padding:8px 10px;text-align:center;font-size:13px;margin-bottom:8px
}

.replayRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.proGame{--gameSpeed:2.2s;background:linear-gradient(180deg,#07101f,#0c2340 58%,#0a172a);border:4px solid #264c70;border-radius:24px;padding:12px;box-shadow:inset 0 0 0 2px #4f7598,0 14px 34px #07101f55;color:#fff;text-align:center;overflow:hidden}
.proGame.paused .moving{animation-play-state:paused!important}
.proGameTop{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.proBrand{text-align:right;font-weight:900;color:#ffe36e;font-size:18px;text-shadow:0 2px 0 #795700}
.proWorld{text-align:center;background:#102d4f;border:2px solid #345f87;border-radius:999px;padding:6px 11px;font-weight:900}
.proScore{text-align:left;font-weight:900;color:#c9f7ff}
.gatePath{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 10px}
.gateDot{height:12px;border-radius:999px;background:#1a3858;border:1px solid #315e86;box-shadow:inset 0 0 7px #0005}
.gateDot.on{background:#58dd9d;box-shadow:0 0 13px #58dd9d99}
.proMission{min-height:62px;display:grid;place-items:center;background:#0e2948;border:2px solid #315a81;border-radius:16px;padding:8px 12px;font-size:20px;font-weight:900;line-height:1.55;color:#f7fbff}
.proArena{position:relative;min-height:330px;margin-top:10px;border:3px solid #2d5d88;border-radius:18px;overflow:hidden;background:
radial-gradient(circle at 18% 22%,#ffffff 0 1px,transparent 1.5px),
radial-gradient(circle at 72% 38%,#ffffff 0 1px,transparent 1.5px),
radial-gradient(circle at 43% 73%,#ffffff 0 1px,transparent 1.5px),
linear-gradient(180deg,#040b18,#0b1e36);background-size:73px 59px,91px 77px,111px 83px,auto;box-shadow:inset 0 0 30px #000}
.proArena:after{content:"";position:absolute;inset:auto 0 0;height:52px;background:linear-gradient(0deg,#14365d,transparent);pointer-events:none}
.gameToast{min-height:40px;font-size:17px;font-weight:900;padding:8px 6px;color:#dff8ff}
.gameToast.good{color:#8ff0bd}.gameToast.try{color:#ffe68c}
.gameControls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.gameControls button{min-height:45px;border:2px solid #315c83;background:#102b4b;color:#fff;border-radius:13px;font-weight:900}
.meteor{position:absolute;width:29%;min-width:86px;max-width:155px;min-height:98px;border:3px solid #6edcf5;background:linear-gradient(145deg,#173c62,#0e2746);color:#fff;border-radius:46% 54% 50% 50%;display:grid;place-items:center;padding:9px;font-size:21px;font-weight:900;box-shadow:0 0 18px #57d8ff66;animation:meteorDrift var(--gameSpeed) ease-in-out infinite alternate;z-index:2}
.meteor:nth-child(2){animation-delay:-.7s}.meteor:nth-child(3){animation-delay:-1.2s}
.meteor:active,.bossChoice:active,.seqPortal:active,.botCard:active{transform:scale(.95)}
@keyframes meteorDrift{from{top:32px}to{top:188px}}
.gameShip{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:48px;z-index:3;filter:drop-shadow(0 0 8px #62ddff)}
.hitBurst{animation:hitBurst .4s ease}@keyframes hitBurst{50%{filter:brightness(2.2);box-shadow:0 0 30px #ffe36e}}
.botGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:18px 12px 8px;position:relative;z-index:2}

.botCard small{display:block;font-size:14px;color:#b9d6ec}
.botCard.charged{border-color:#58dd9d;background:#103d3b;box-shadow:0 0 20px #58dd9d55}
.botPulse{animation:botPulse 1s ease-in-out infinite alternate}@keyframes botPulse{to{transform:translateY(-5px)}}
.energyMeter{display:flex;justify-content:center;gap:9px;margin:8px 0}
.energyOrb{width:30px;height:30px;border-radius:50%;border:3px solid #51728f;background:#10243c;box-shadow:inset 0 0 8px #0008}
.energyOrb.on{background:#58dd9d;border-color:#a7ffd0;box-shadow:0 0 14px #58dd9d}
.seqTrack{position:relative;z-index:2;padding:26px 10px 8px}
.seqLine{font-size:38px;font-weight:900;color:#fff;margin:12px 0 24px;text-shadow:0 2px 0 #000}
.seqChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seqPortal{min-height:100px;border:4px solid #6bdcff;background:radial-gradient(circle,#1d5578,#102a48);color:#fff;border-radius:50%;font-size:52px;font-weight:900;box-shadow:0 0 22px #5be0ff66;animation:portalPulse 1.1s ease-in-out infinite alternate}
@keyframes portalPulse{to{box-shadow:0 0 34px #ffe36e99;border-color:#ffe36e}}
.bossHead{position:relative;z-index:2;font-size:58px;padding-top:12px}
.bossShield{display:flex;justify-content:center;gap:7px;margin:5px 0 11px}
.shieldOrb{width:28px;height:28px;border-radius:7px;transform:rotate(45deg);background:#ffcc4b;box-shadow:0 0 12px #ffcc4b}
.shieldOrb.off{background:#273e58;box-shadow:none}
.bossGrid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:8px}
.bossChoice{min-height:100px;border:3px solid #5c7fa0;border-radius:18px;background:#112c4c;color:#fff;font-size:26px;font-weight:900;padding:8px;box-shadow:0 7px 14px #0004}
.bossChoice strong{font-size:48px;display:block}
.gameStart{display:grid;place-items:center;min-height:320px;padding:18px;position:relative;z-index:2}
.gameStartBadge{font-size:84px;filter:drop-shadow(0 0 14px #ffe36e)}
.gameStart h2{margin:5px 0;font-size:29px;color:#ffe36e}.gameStart p{font-size:18px;line-height:1.7;color:#dceeff}
.gameStart button{width:min(330px,92%);min-height:62px;font-size:21px}
.gameWin{display:grid;place-items:center;min-height:320px;padding:16px;position:relative;z-index:2}
.gameMedal{font-size:86px;filter:drop-shadow(0 0 16px #ffd84c)}
.gameWin h2{color:#ffe36e;font-size:31px;margin:3px}.gameWin p{font-size:18px;line-height:1.8;color:#e6f5ff}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffe36e;pointer-events:none;animation:spark .7s ease-out forwards;z-index:8}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
@media(prefers-reduced-motion:reduce){.moving,.botPulse,.seqPortal{animation:none!important}.proGame{--gameSpeed:999s}}
@media(max-width:430px){.arcadeScreen{height:240px}.alien{font-size:20px;height:88px}.replayRow{grid-template-columns:1fr}}

@media(max-width:430px){
 .card{padding:13px}.instruction{font-size:19px}.hero{font-size:120px}.choice{font-size:25px;min-height:75px}
 .item{font-size:35px;min-height:75px}.dots{font-size:47px}.trace{height:255px}.trace .guide{font-size:185px}
}
</style>
</head>
<body>
<div class="shell">

</div>
<script>
(()=>{"use strict";
const E="٠١٢٣٤٥٦٧٨٩", ar=n=>String(n).replace(/[0-9]/g,d=>E[Number(d)]);
const $=id=>document.getElementById(id);
const stageEl=$("stage"), titleEl=$("title"), instEl=$("instruction"), msgEl=$("msg"), bar=$("bar"), off=$("offline");

const AUDIO=[
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=715f5d8c-e62e-4a58-8a70-05b06e90a1b7.wav",

"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=86c6733d-5528-4896-8380-d71ae870f542.wav",

"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=dd9e5b56-075e-4f08-b251-5c1742e1c593.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=b42f8e81-265e-4974-a58c-ca127d0c7d07.wav",

];
let audioIndex=0;
const narrator=new Audio();
narrator.preload="auto";
function playAudio(i){
  audioIndex=Math.max(0,Math.min(AUDIO.length-1,i));
  try{narrator.pause();narrator.currentTime=0;narrator.src=AUDIO[audioIndex];narrator.play().catch(()=>{});}catch{}
}
let retroCtx=null;
function retroTone(freq=520,dur=.08,type="square"){
  try{
    retroCtx=retroCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=retroCtx.createOscillator(),g=retroCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,retroCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,retroCtx.currentTime+dur);
    o.connect(g);g.connect(retroCtx.destination);o.start();o.stop(retroCtx.currentTime+dur);
  }catch{}
}

const lessonId=(location.pathname.split("/").pop()||"number-4").replace(/[^a-z0-9-]/gi,"").slice(0,80)||"number-4";
const STAGES=["start","diagnostic","count","make","match","picture","realworld","bridge","sequence","symbol","name","trace","final","done"];
let step=0, sessionId=localStorage.getItem("dt_session_"+lessonId)||"", alias=localStorage.getItem("dt_alias_"+lessonId)||"";const savedStep=Number(localStorage.getItem("dt_step_"+lessonId)||"0");if(sessionId&&alias&&Number.isInteger(savedStep)&&savedStep>0&&savedStep<STAGES.length)step=savedStep;
let stageStarted=Date.now(), attempts=0, firstTry=true, selected=new Set(), locked=false, finalIndex=0;
let mastery={count:0,make:0,match:0,quantity:0,sequence:0,symbol:0,name:0,trace:0};
let fastTrack=false;
const queueKey="dt_queue_v1";
const queue=()=>{try{return JSON.parse(localStorage.getItem(queueKey)||"[]")}catch{return[]}};
function setQueue(q){localStorage.setItem(queueKey,JSON.stringify(q.slice(-500)))}
async function post(url,data){
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    if(!r.ok)throw new Error("http");
    return await r.json();
  }catch(e){return null}
}
async function event(eventType,extra={}){
  if(!sessionId)return;
  const body={

  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height,scale=Math.min(1,max/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);
   const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
   URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",quality))
  };img.onerror=reject;img.src=url
 })
}

  function adaptiveSpeed(){
    if(mistakes>=3)return "3.3s";
    if(streak>=3)return "1.75s";
    return "2.25s";
  }
  function startScreen(){
    setWorld(0,"استعداد");mission.textContent="مهمة حارس العدد ٤";arena.innerHTML="";
    const box=document.createElement("div");box.className="gameStart";
    box.innerHTML='<div><div class="gameStartBadge">🛡️٤</div><h2>مهمة حارس العدد ٤</h2><p>أربع بوابات قصيرة.<br>كل بوابة تثبت مهارة من الدرس.<br>لا توجد خسارة؛ إذا أخطأت سأساعدك.</p></div>';
    const go=button("🚀 ابدأ المهمة","primary");go.onclick=()=>{gameStartedAt=Date.now();event("pro_game_start",{payload:{version:"guardian4-v1"}});showWorld1()};
    box.appendChild(go);arena.appendChild(box);setAudio(16,true);
  }
  function showWorld1(){
    setWorld(1,"البوابة ١");mission.textContent="اضرب النيزك الذي يحمل ٤ نجوم فقط.";arena.innerHTML="";
    const ship=document.createElement("div");ship.className="gameShip";ship.textContent="🚀";arena.appendChild(ship);
    let hits=0,busy=false;
    setAudio(17,true);
    function wave(){
      if(paused)return;busy=false;worldStarted=Date.now();[...arena.querySelectorAll(".meteor")].forEach(x=>x.remove());
      wrap.style.setProperty("--gameSpeed",adaptiveSpeed());
      const vals=shuffle([3,4,5]),lefts=["3%","35.5%","68%"];
      vals.forEach((n,i)=>{
        const t=document.createElement("button");t.type="button";t.className="meteor moving";t.style.left=lefts[i];
        t.setAttribute("aria-label","نيزك فيه "+ar(n)+" نجوم");
        t.innerHTML="<div>"+Array(n).fill("⭐").join(" ")+"</div>";
        t.onclick=()=>{
          if(paused||busy)return;
          if(n===4){busy=true;hits++;correct(t,{mission:"quantity",chosen:n,hit:hits});score.textContent="⭐ "+ar(hits);
            speakMsg("إصابة صحيحة! "+ar(hits)+" من ٤","good");
            if(hits>=4){gateEls[0].classList.add("on");setTimeout(showWorld2,650)}else setTimeout(wave,620);
          }else{wrong(t,{mission:"quantity",chosen:n});speakMsg(mistakes>=2?"ليس ٤. المس النجوم واحدة واحدة أثناء العد.":"ليس ٤. عدّ النجوم ثم حاول.","try");wrap.style.setProperty("--gameSpeed",adaptiveSpeed())}
        };
        arena.appendChild(t);
      });
    }
    wave();
  }
  function showWorld2(){
    setWorld(2,"البوابة ٢");mission.textContent="أعطِ كل روبوت طاقة واحدة حتى تشحن ٤ روبوتات.";arena.innerHTML="";score.textContent="⚡ ٠ / ٤";
    const meter=document.createElement("div");meter.className="energyMeter";const orbs=[];
    for(let i=0;i<4;i++){const o=document.createElement("span");o.className="energyOrb";orbs.push(o);meter.appendChild(o)}
    const grid=document.createElement("div");grid.className="botGrid";let charged=0;
    for(let i=0;i<4;i++){
      const b=document.createElement("button");b.type="button";b.className="botCard botPulse";b.innerHTML="🤖<small>يحتاج طاقة</small>";
      b.onclick=()=>{
        if(paused)return;
        if(b.classList.contains("charged")){wrong(b,{mission:"one_to_one",repeat:true});speakMsg("هذا الروبوت أخذ طاقته. اختر روبوتًا آخر.","try");return}
        b.classList.add("charged");b.classList.remove("botPulse");b.innerHTML="🤖⚡<small>جاهز</small>";charged++;orbs[charged-1].classList.add("on");
        correct(b,{mission:"one_to_one",charged});score.textContent="⚡ "+ar(charged)+" / ٤";speakMsg("ممتاز! روبوت واحد، طاقة واحدة.","good");
        if(charged===4){gateEls[1].classList.add("on");setTimeout(showWorld3,700)}
      };
      grid.appendChild(b);
    }
    arena.append(meter,grid);setAudio(18,true);worldStarted=Date.now();
  }
  function showWorld3(){
    setWorld(3,"البوابة ٣");mission.textContent="أكمل المسار: ١، ٢، ٣، ثم ماذا؟";arena.innerHTML="";score.textContent="🛤️ ١ ٢ ٣ □";
    const box=document.createElement("div");box.className="seqTrack";
    const line=document.createElement("div");line.className="seqLine";line.textContent="١  ←  ٢  ←  ٣  ←  □";
    const opts=document.createElement("div");opts.className="seqChoices";
    shuffle(["٢","٤","٥"]).forEach(v=>{
      const b=document.createElement("button");b.type="button";b.className="seqPortal moving";b.textContent=v;
      b.onclick=()=>{
        if(paused)return;
        if(v==="٤"){correct(b,{mission:"sequence",chosen:v});speakMsg("صحيح! بعد ٣ يأتي ٤.","good");score.textContent="🛤️ ١ ٢ ٣ ٤";gateEls[2].classList.add("on");setTimeout(showBoss,720)}
        else{wrong(b,{mission:"sequence",chosen:v});speakMsg("ابدأ من ١ وعدّ: ١، ٢، ٣، ...","try")}
      };
      opts.appendChild(b);
    });
    box.append(line,opts);arena.appendChild(box);setAudio(19,true);worldStarted=Date.now();
  }
  function showBoss(){
    setWorld(4,"المواجهة");mission.textContent="اعثر على ٤ مهما تغيّر شكله.";arena.innerHTML="";score.textContent="🛡️ ٤";
    const head=document.createElement("div");head.className="bossHead";head.textContent="👾";
    const shield=document.createElement("div");shield.className="bossShield";const shieldEls=[];
    for(let i=0;i<4;i++){const s=document.createElement("span");s.className="shieldOrb";shieldEls.push(s);shield.appendChild(s)}
    const grid=document.createElement("div");grid.className="bossGrid";arena.append(head,shield,grid);
    const rounds=[
      {kind:"quantity",q:"أين توجد ٤؟",opts:[{v:3,h:"● ● ●"},{v:4,h:"● ● ● ●"},{v:5,h:"● ● ● ● ●"}],answer:4},
      {kind:"symbol",q:"أين رمز أربعة؟",opts:[{v:"٣",h:"<strong>٣</strong>"},{v:"٤",h:"<strong>٤</strong>"},{v:"٥",h:"<strong>٥</strong>"}],answer:"٤"},
      {kind:"name",q:"ما اسم ٤؟",opts:[{v:"ثلاثة",h:"ثلاثة"},{v:"أربعة",h:"أربعة"},{v:"خمسة",h:"خمسة"}],answer:"أربعة"},
      {kind:"transfer",q:"أي مجموعة ما زالت ٤؟",opts:[{v:4,h:"🍎 🍎 🍎 🍎"},{v:5,h:"⚽ ⚽ ⚽ ⚽ ⚽"},{v:3,h:"🐟 🐟 🐟"}],answer:4}
    ];
    let r=0;setAudio(20,true);
    function round(){
      worldStarted=Date.now();grid.innerHTML="";mission.textContent=rounds[r].q;const spec=rounds[r];
      shuffle(spec.opts).forEach(o=>{
        const b=document.createElement("button");b.type="button";b.className="bossChoice";b.innerHTML=o.h;
        b.onclick=()=>{
          if(paused)return;
          if(o.v===spec.answer){correct(b,{mission:"boss_"+spec.kind,round:r+1});shieldEls[r].classList.add("off");r++;score.textContent="🛡️ "+ar(4-r);
            speakMsg("أصبت الدرع! بقي "+ar(4-r)+".","good");
            if(r>=4){gateEls[3].classList.add("on");setTimeout(winGame,720)}else setTimeout(round,620);
          }else{wrong(b,{mission:"boss_"+spec.kind,round:r+1,chosen:o.v});speakMsg(mistakes>=3?"فكّر في معنى ٤: أربع أشياء، الرمز ٤، والاسم أربعة.":"جرّب مرة أخرى. ابحث عن ٤.","try")}
        };
        grid.appendChild(b);
      });
    }
    round();
  }
  function winGame(){
    arena.innerHTML="";mission.textContent="اكتملت المهمة بنجاح";score.textContent="🏆 ٤ / ٤";
    localStorage.setItem("dt_game_badge_"+lessonId,"guardian4");
    const w=document.createElement("div");w.className="gameWin";
    w.innerHTML='<div><div class="gameMedal">🏅</div><h2>وسام حارس ٤</h2><p>أتقنت ٤ في الكمية، والمطابقة، والتسلسل، والرمز، والاسم.<br><b>المعلّم محمد غنام</b></p></div>';
    const row=document.createElement("div");row.className="replayRow";
    const again=button("🎮 العب من جديد","primary");again.onclick=()=>{streak=0;mistakes=0;score.textContent="⭐ ٠";startScreen()};
    const back=button("✅ العودة للإنجاز","secondary");back.onclick=()=>{step=13;render()};
    row.append(again,back);w.appendChild(row);arena.appendChild(w);speakMsg("أربع بوابات مكتملة!","good");
    event("pro_game_complete",{correct:true,payload:{game:"guardian4-v1",mistakes,durationMs:Date.now()-gameStartedAt}});
    setAudio(21,true);retroTone(660,.11);setTimeout(()=>retroTone(880,.11),120);setTimeout(()=>retroTone(1100,.18),260);
  }

  listen.onclick=()=>playAudio(currentAudio);
  pause.onclick=()=>{paused=!paused;wrap.classList.toggle("paused",paused);pause.textContent=paused?"▶ متابعة":"⏸ إيقاف";speakMsg(paused?"اللعبة متوقفة. اضغط متابعة عندما تكون جاهزًا.":"هيا نكمل!","")};
  full.onclick=async()=>{try{if(!document.fullscreenElement&&wrap.requestFullscreen)await wrap.requestFullscreen();else if(document.fullscreenElement)await document.exitFullscreen()}catch{}};
  exit.onclick=()=>{try{narrator.pause()}catch{};event("pro_game_exit",{payload:{world,mistakes}});step=13;render()};
  startScreen();
}
function doneStage(){
  head("أحسنت يا بطل!","أنهيت درس العدد ٤.");
  bar.style.width="100%";
  const d=document.createElement("div");d.className="done";d.innerHTML='<div class="bigicon">🎉 🏆 🎉</div><div class="hero" style="font-size:110px">٤</div><div>أعرف العدد ٤ ⭐<br>أعدّ ٤ أشياء.<br>أكوّن مجموعة من ٤.<br>أعرف أن بعد ٣ يأتي ٤.<br>أعرف الرمز ٤ وكلمة «أربعة».<br>وأكتب ٤ بإصبعي.</div><div class="small" style="margin-top:14px">إعداد: محمد غنام</div>';
  const row=document.createElement("div");row.className="replayRow";
  const replay=button("🔁 أعد الدرس","primary");replay.onclick=()=>restartLesson(replay);
  const arcade=button("🎮 لعبة حارس ٤","secondary");arcade.onclick=arcadeStage;
  row.append(replay,arcade);d.appendChild(row);
  stageEl.appendChild(d);
}
$("listenBtn").onclick=()=>playAudio(audioIndex);
render();flush();
})();
</script>
</body>
</html>
