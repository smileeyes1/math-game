<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<title>المعلّم الرقمي محمد غنام</title><!-- مصمم لطفل بعمر ٧ سنوات: مهمة واحدة في الشاشة، لمس مباشر، تعليمات قصيرة -->
<style>
:root{
  --bg:#eef8ff;--card:#fff;--ink:#17324a;--muted:#61788d;--line:#dbe6ef;
  --gold:#f6c84b;--green:#178451;--green-soft:#ecfbf3;--red:#c64444;--red-soft:#fff1f1;
  --blue:#2e6fc8;--blue-soft:#edf5ff;--purple:#7651d4;--purple-soft:#f2edff
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:
radial-gradient(circle at 90% 0,#fff1b9 0,transparent 25%),
linear-gradient(180deg,#eaf7ff,#fffaf0 78%);color:var(--ink);
font-family:Tahoma,Arial,"Noto Sans Arabic",sans-serif}
body{direction:rtl;text-align:right}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:4px solid #86bdf0;outline-offset:2px}button:disabled{opacity:.7}
.shell{max-width:760px;margin:auto;padding:10px 10px max(24px,env(safe-area-inset-bottom))}
.teacher{
 display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px
}
.teacher-badge{
 width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;
 background:linear-gradient(145deg,#1d4f7a,#2e78aa);color:#fff;box-shadow:0 6px 18px #1d4f7a33
}
.teacher .name{font-weight:900}.teacher .sub{font-size:13px;color:var(--muted)}.listen{margin-right:auto;border:0;background:#edf5ff;color:#245c9c;border-radius:999px;padding:9px 12px;font-weight:900}
.card{
 background:var(--card);border:1px solid #e6edf3;border-radius:26px;padding:16px;
 box-shadow:0 16px 42px rgba(23,50,74,.10)
}
.progress{height:11px;border-radius:99px;background:#e9eef3;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffbd32,#ffe078);transition:.25s}
h1{text-align:center;font-size:28px;margin:4px 0 7px}
.instruction{text-align:center;font-size:22px;line-height:1.75;font-weight:900;margin:0 0 13px;max-width:620px;margin-inline:auto}
.stage{min-height:320px}
.msg{min-height:42px;text-align:center;font-size:18px;font-weight:900;line-height:1.6;margin-top:10px}
.msg.ok{color:var(--green)}.msg.no{color:var(--red)}
.center{text-align:center}.hero{font-size:140px;font-weight:900;line-height:1;color:#ef743b;margin:10px 0}
.bigicon{font-size:55px;line-height:1.7}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.choice,.item,.primary,.secondary{
 min-height:82px;border:3px solid var(--line);border-radius:20px;background:#fff;color:var(--ink);
 padding:10px;font-weight:900
}
.choice{font-size:32px}.item{font-size:44px}.countBadge{display:inline-grid;place-items:center;min-width:58px;height:58px;border-radius:18px;background:#17324a;color:#fff;font-size:34px;font-weight:900;margin:8px auto}.rabbits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.rabbitSlot{border:2px solid #dbe6ef;border-radius:18px;padding:10px;text-align:center;font-size:36px;background:#fbfdff}.rabbitSlot.fed{background:#ecfbf3;border-color:#50b77a}.tapnote{text-align:center;font-size:16px;color:#61788d;margin:7px 0 10px}
.primary{width:100%;margin-top:12px;background:linear-gradient(#ffe584,#ffc747);border-color:#efbe43;color:#684400;font-size:20px}
.secondary{background:var(--blue-soft);border-color:#c9dcfb;color:#245c9c;font-size:17px}
.good{border-color:#50b77a!important;background:var(--green-soft)!important}
.bad{border-color:#e67a7a!important;background:var(--red-soft)!important}
.scene{border:2px dashed #ccdfed;background:#f9fcff;border-radius:22px;padding:14px}
.pool,.basket{min-height:108px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:10px}
.pool{background:#f8fbfd;border:2px dashed #d4dfe8;border-radius:20px;margin-bottom:10px}
.basket{background:#fff6e7;border:5px solid #b88349;border-top-width:10px;border-radius:18px}
.bridge{text-align:center;background:#fff7dc;border:2px solid #ffe18d;border-radius:22px;padding:16px}
.dots{font-size:58px;line-height:1.4}.word{font-size:32px;font-weight:900;margin:6px}
.hint{background:#f3f8fd;border-right:5px solid #77a9dd;border-radius:13px;padding:10px 12px;line-height:1.7;margin-top:10px}
.photo-box{border:2px solid #d8e4ee;border-radius:22px;background:#fbfdff;padding:14px;text-align:center}
.photo-box .camera{font-size:58px}.privacy{font-size:14px;line-height:1.7;color:var(--muted);margin:8px 0}
.photo-preview{max-width:100%;max-height:260px;border-radius:16px;margin-top:9px;display:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions>*{flex:1}
.trace{height:300px;position:relative;border:2px dashed #ccd7e0;border-radius:20px;background:#fff;overflow:hidden;touch-action:none}
.trace .guide{position:absolute;inset:0;display:grid;place-items:center;font-size:215px;font-weight:900;color:#e1e8ee;user-select:none}
.trace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.alias{max-width:420px;margin:15px auto}
.alias input{
 width:100%;font-size:21px;border:2px solid #cad9e5;border-radius:17px;padding:13px 15px;text-align:center;outline:none
}
.alias input:focus{border-color:#679fd0;box-shadow:0 0 0 3px #dcecff}
.small{text-align:center;color:var(--muted);font-size:14px;line-height:1.7}
.done{text-align:center;font-size:25px;font-weight:900;line-height:1.9}
.offline{
 display:none;background:#fff1cf;color:#704d00;border-radius:12px;padding:8px 10px;text-align:center;font-size:13px;margin-bottom:8px
}

.arcadeWrap{background:#08152b;border:5px solid #1d3557;border-radius:22px;padding:12px;box-shadow:inset 0 0 0 3px #3d5a80,0 10px 26px #08152b44;color:#fff;text-align:center}
.arcadeTitle{font-weight:900;font-size:24px;letter-spacing:.5px;margin-bottom:7px;color:#ffe36e;text-shadow:2px 2px 0 #8c5d00}
.arcadeHud{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0 10px;font-weight:900}
.arcadeScore{background:#10284b;border:2px solid #31527d;border-radius:12px;padding:6px 10px}
.arcadeScreen{position:relative;height:270px;overflow:hidden;border:3px solid #31527d;border-radius:14px;background:
linear-gradient(#071021,#0c1d38);box-shadow:inset 0 0 24px #000}
.arcadeScreen:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.5px);background-size:37px 31px;opacity:.28;pointer-events:none}
.alien{position:absolute;top:35px;width:30%;min-width:82px;max-width:150px;height:95px;border:3px solid #77e1ff;border-radius:12px;background:#12335a;color:#fff;font-size:23px;font-weight:900;display:grid;place-items:center;padding:6px;animation:arcadeFloat 1.15s ease-in-out infinite alternate;box-shadow:0 0 14px #45d9ff77}
.alien:nth-child(2){animation-delay:.15s}.alien:nth-child(3){animation-delay:.3s}
.alien.goodTarget{border-color:#ffd84c}
.alien:active{transform:scale(.94)}
@keyframes arcadeFloat{from{top:30px}to{top:145px}}
.arcadeShip{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:46px;filter:drop-shadow(0 0 8px #6cf)}
.arcadeFlash{animation:flash .24s 2}@keyframes flash{50%{filter:brightness(2)}}
.arcadeWin{font-size:30px;line-height:1.7;padding:28px 8px;color:#ffe36e;font-weight:900}
.replayRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
@media(max-width:430px){.arcadeScreen{height:240px}.alien{font-size:20px;height:88px}.replayRow{grid-template-columns:1fr}}

@media(max-width:430px){
 .card{padding:13px}.instruction{font-size:19px}.hero{font-size:120px}.choice{font-size:25px;min-height:75px}
 .item{font-size:35px;min-height:75px}.dots{font-size:47px}.trace{height:255px}.trace .guide{font-size:185px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="teacher">
    <div class="teacher-badge">م غ</div>
    <div><div class="name">المعلّم الرقمي محمد غنام</div><div class="sub">أنا معك خطوة خطوة</div></div><button id="listenBtn" class="listen" type="button">🔊 اسمع</button>
  </div>
  <div id="offline" class="offline">لا يوجد اتصال الآن. يمكنك المتابعة، وسأرسل تقدمك عند عودة الإنترنت.</div>
  <main class="card">
    <div class="progress"><span id="bar"></span></div>
    <h1 id="title">مغامرة العدد ٤</h1>
    <p class="instruction" id="instruction">جاهز للمغامرة؟</p>
    <section class="stage" id="stage"></section>
    <div id="msg" class="msg" aria-live="polite"></div>
  </main>
</div>
<script>
(()=>{"use strict";
const E="٠١٢٣٤٥٦٧٨٩", ar=n=>String(n).replace(/[0-9]/g,d=>E[Number(d)]);
const $=id=>document.getElementById(id);
const stageEl=$("stage"), titleEl=$("title"), instEl=$("instruction"), msgEl=$("msg"), bar=$("bar"), off=$("offline");

const AUDIO=[
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=715f5d8c-e62e-4a58-8a70-05b06e90a1b7.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=7d28dc6d-69d0-484d-a4fc-9d4a4c4e2f2f.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=86c6733d-5528-4896-8380-d71ae870f542.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=1ed4997b-e269-435b-bfc7-931ffe22eb64.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=20ea42b7-7f5b-491e-9222-744f5fed570d.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=17b3a135-b7eb-4315-8401-7afdd67ff6fc.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=dd9e5b56-075e-4f08-b251-5c1742e1c593.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=b42f8e81-265e-4974-a58c-ca127d0c7d07.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=f1890635-baef-4620-be37-9a976ae577f1.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=6785ceb9-e74c-46db-a5b6-e5fa6f6ad6ac.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=35b6784e-4c2f-4bd5-9687-b895414a5256.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=635127e8-a65f-4222-a397-4af48f0afe63.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=8378f0ad-042b-4820-ad28-c0b58ce40efe.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=0550017f-2c6a-456c-a065-2bec34b3c354.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=c8bba1b3-2e2e-4c10-a41f-6cf76952693d.wav",
"https://resource2.heygen.ai/text_to_speech/2e59004d26bd438bb05243aa25431ea8/2d432723a02444acb48e28ada714cc43/id=5a24a2f3-d2db-4279-a972-37913d68ba88.wav"
];
let audioIndex=0;
const narrator=new Audio();
narrator.preload="auto";
function playAudio(i){
  audioIndex=Math.max(0,Math.min(AUDIO.length-1,i));
  try{narrator.pause();narrator.currentTime=0;narrator.src=AUDIO[audioIndex];narrator.play().catch(()=>{});}catch{}
}
let retroCtx=null;
function retroTone(freq=520,dur=.08,type="square"){
  try{
    retroCtx=retroCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=retroCtx.createOscillator(),g=retroCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.055,retroCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,retroCtx.currentTime+dur);
    o.connect(g);g.connect(retroCtx.destination);o.start();o.stop(retroCtx.currentTime+dur);
  }catch{}
}

const lessonId=(location.pathname.split("/").pop()||"number-4").replace(/[^a-z0-9-]/gi,"").slice(0,80)||"number-4";
const STAGES=["start","diagnostic","count","make","match","picture","realworld","bridge","sequence","symbol","name","trace","final","done"];
let step=0, sessionId=localStorage.getItem("dt_session_"+lessonId)||"", alias=localStorage.getItem("dt_alias_"+lessonId)||"";const savedStep=Number(localStorage.getItem("dt_step_"+lessonId)||"0");if(sessionId&&alias&&Number.isInteger(savedStep)&&savedStep>0&&savedStep<STAGES.length)step=savedStep;
let stageStarted=Date.now(), attempts=0, firstTry=true, selected=new Set(), locked=false, finalIndex=0;
let mastery={count:0,make:0,match:0,quantity:0,sequence:0,symbol:0,name:0,trace:0};
let fastTrack=false;
const queueKey="dt_queue_v1";
const queue=()=>{try{return JSON.parse(localStorage.getItem(queueKey)||"[]")}catch{return[]}};
function setQueue(q){localStorage.setItem(queueKey,JSON.stringify(q.slice(-500)))}
async function post(url,data){
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
    if(!r.ok)throw new Error("http");
    return await r.json();
  }catch(e){return null}
}
async function event(eventType,extra={}){
  if(!sessionId)return;
  const body={
    sessionId,lessonId,stage:STAGES[step]||"done",eventType,
    attempts,correct:typeof extra.correct==="boolean"?extra.correct:null,
    responseMs:Date.now()-stageStarted,
    progress:Math.round((step/(STAGES.length-1))*100),
    mastery,status:step>=STAGES.length-1?"completed":"active",
    payload:extra.payload||{}
  };
  const ok=await post("/api/events",body);
  if(!ok){const q=queue();q.push({url:"/api/events",data:body});setQueue(q)}
}
async function flush(){
  if(!navigator.onLine)return;
  let q=queue(),left=[];
  for(const x of q){const ok=await post(x.url,x.data);if(!ok)left.push(x)}
  setQueue(left);
}
window.addEventListener("online",()=>{off.style.display="none";flush()});
window.addEventListener("offline",()=>off.style.display="block");
off.style.display=navigator.onLine?"none":"block";
setInterval(flush,12000);

function progress(){bar.style.width=Math.min(100,Math.max(0,(step/(STAGES.length-1))*100))+"%"}
function head(t,i){titleEl.textContent=t;instEl.textContent=i;msgEl.textContent="";msgEl.className="msg";stageStarted=Date.now();attempts=0;selected=new Set();progress();event("stage_view");audioIndex=Math.max(0,Math.min(AUDIO.length-1,step));if(step>0)setTimeout(()=>playAudio(audioIndex),120)}
function ok(t){msgEl.textContent=t;msgEl.className="msg ok";try{navigator.vibrate&&navigator.vibrate(25)}catch{}}
function no(t){attempts++;firstTry=false;msgEl.textContent=t;msgEl.className="msg no";event("answer",{correct:false,payload:{hintLevel:attempts}})}
function hint(t){const h=document.createElement("div");h.className="hint";h.textContent=t;stageEl.appendChild(h);event("hint",{payload:{level:attempts}})}
function next(skill,text){
  if(locked)return;locked=true;
  if(skill)mastery[skill]=Math.max(mastery[skill]||0,firstTry?2:1);
  event("stage_complete",{correct:true,payload:{firstTry}});
  ok(text);
  setTimeout(()=>{step++;locked=false;firstTry=true;render()},650)
}
function button(text,cls="choice"){const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=text;return b}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function markWrong(b,t){
  b&&b.classList.add("bad");setTimeout(()=>b&&b.classList.remove("bad"),450);no(t);
  if(attempts===2)hint("عدّ ببطء، والمس كل شيء مرة واحدة فقط.");
}

async function startSession(){
  const v=$("aliasInput").value.trim().replace(/\s+/g," ").slice(0,40);
  if(v.length<2){no("اكتب اسمك الأول أو الرمز الذي أعطاك إياه المعلم.");return}
  const r=await post("/api/sessions",{alias:v,lessonId});
  if(!r){no("نحتاج اتصالًا بالإنترنت في أول مرة فقط. حاول مرة أخرى.");return}
  alias=v;sessionId=r.session.id;localStorage.setItem("dt_alias_"+lessonId,alias);localStorage.setItem("dt_session_"+lessonId,sessionId);
  step=1;render();
}
function render(){
  if(sessionId&&alias)localStorage.setItem("dt_step_"+lessonId,String(step));stageEl.innerHTML="";msgEl.textContent="";progress();
  if(step===0)return welcome();
  if(step===1)return diagnostic();
  if(step===2)return countStage();
  if(step===3)return makeStage();
  if(step===4)return matchStage();
  if(step===5)return pictureStage();
  if(step===6)return realWorldStage();
  if(step===7)return bridgeStage();
  if(step===8)return sequenceStage();
  if(step===9)return symbolStage();
  if(step===10)return nameStage();
  if(step===11)return traceStage();
  if(step===12)return finalStage();
  return doneStage();
}
function welcome(){
  head("مغامرة العدد ٤","اكتب اسمك الأول أو الرمز الذي أعطاك إياه المعلم، ثم ابدأ.");
  const c=document.createElement("div");c.className="center";
  c.innerHTML='<div class="hero">٤</div><div class="bigicon">✨ 🔑 ⭐</div>';
  const a=document.createElement("div");a.className="alias";
  a.innerHTML='<input id="aliasInput" maxlength="40" autocomplete="off" inputmode="text" placeholder="اسمك الأول أو الرمز">';
  const b=button("ابدأ المغامرة","primary");b.onclick=startSession;
  stageEl.append(c,a,b);
}
function diagnostic(){
  head("تحدٍّ سريع","أي مجموعة فيها ٤ نجوم؟");
  const g=document.createElement("div");g.className="grid3";
  shuffle([{t:"⭐ ⭐ ⭐",ok:0},{t:"⭐ ⭐ ⭐ ⭐",ok:1},{t:"⭐ ⭐ ⭐ ⭐ ⭐",ok:0}]).forEach(x=>{
    const b=button(x.t);b.onclick=()=>{
      if(x.ok){fastTrack=firstTry;next("quantity","أحسنت! رأيت ٤ بسرعة.");}
      else markWrong(b,"جرّب العد مرة أخرى.");
    };g.appendChild(b)
  });stageEl.appendChild(g);
}
function countStage(){
  head("اجمع ٤ مفاتيح","المس ٤ مفاتيح فقط، وعدّها واحدًا واحدًا.");
  const g=document.createElement("div");g.className="grid3 scene";const got=new Set();
  for(let i=0;i<6;i++){
    const b=button("🔑","item");
    b.onclick=()=>{
      if(got.has(i))return;
      if(got.size>=4){markWrong(b,"توقّف. نحتاج ٤ فقط.");return}
      got.add(i);b.classList.add("good");event("object_selected",{payload:{count:got.size}});
      if(got.size===4)next("count","ممتاز! عددتَ ٤ مفاتيح.");
    };g.appendChild(b)
  }stageEl.appendChild(g);
}
function makeStage(){
  head("كوِّن ٤","المس ٤ بلورات. سأضعها في السلة لك.");
  const counter=document.createElement("div");counter.className="center";
  counter.innerHTML='<div class="countBadge">٠</div><div class="tapnote">المس البلورات واحدة واحدة</div>';
  const pool=document.createElement("div");pool.className="grid3 scene";
  const basket=document.createElement("div");basket.className="basket";
  const chosen=new Set();
  const badge=()=>counter.querySelector(".countBadge");
  for(let i=0;i<6;i++){
    const b=button("💎","item");
    b.onclick=()=>{
      if(chosen.has(i)||locked)return;
      if(chosen.size>=4){markWrong(b,"يكفي ٤. أحسنت العد.");return}
      chosen.add(i);b.disabled=true;b.classList.add("good");
      const gem=document.createElement("span");gem.textContent="💎";gem.style.fontSize="38px";basket.appendChild(gem);
      badge().textContent=ar(chosen.size);
      event("object_selected",{payload:{kind:"crystal",count:chosen.size}});
      if(chosen.size===4)setTimeout(()=>next("make","ممتاز! كوّنتَ مجموعة من ٤."),280);
    };
    pool.appendChild(b);
  }
  stageEl.append(counter,pool,basket);
}

function compressImage(file,max=720,quality=.72){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{let w=img.width,h=img.height,scale=Math.min(1,max/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);
   const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
   URL.revokeObjectURL(url);resolve(c.toDataURL("image/jpeg",quality))
  };img.onerror=reject;img.src=url
 })
}
async function uploadEvidence(dataUrl,stage,caption){
  const body={sessionId,lessonId,stage,dataUrl,caption};const r=await post("/api/evidence",body);
  if(!r){const q=queue();q.push({url:"/api/evidence",data:body});setQueue(q);return false}
  return true
}
function realWorldStage(){
  head("مهمة حقيقية","أحضر ٤ أقلام أو ٤ أشياء صغيرة، وضعها أمامك.");
  const box=document.createElement("div");box.className="photo-box";
  box.innerHTML='<div class="camera">🖍️ 🖍️ 🖍️ 🖍️</div><div style="font-size:20px;font-weight:900">ضع ٤ أشياء أمامك</div><div class="small">إذا أحببت، يمكنك إرسال صورة للأشياء فقط.</div><div class="privacy">إذا أردت، صوّر الأشياء فقط ولا تصوّر وجهك. ستصل الصورة إلى المعلم محمد غنام للمراجعة. يمكنك المتابعة دون صورة.</div>';
  const input=document.createElement("input");input.type="file";input.accept="image/jpeg,image/png,image/webp";input.setAttribute("capture","environment");input.style.display="none";
  const preview=document.createElement("img");preview.className="photo-preview";
  let dataUrl="";
  const choose=button("📷 صورة اختيارية","secondary");choose.onclick=()=>input.click();
  input.onchange=async()=>{const f=input.files&&input.files[0];if(!f)return;if(f.size>8*1024*1024){no("الصورة كبيرة جدًا. اختر صورة أصغر.");return}
    try{dataUrl=await compressImage(f);preview.src=dataUrl;preview.style.display="block";ok("الصورة جاهزة للإرسال.");}catch{no("تعذر تجهيز الصورة. يمكنك المتابعة دونها.")}
  };
  const send=button("أرسل الصورة وأكمل","secondary");send.onclick=async()=>{
    if(dataUrl){send.disabled=true;const sent=await uploadEvidence(dataUrl,"realworld","مهمة: ٤ أشياء من البيئة");event("real_world_task",{correct:null,payload:{evidence:sent?"sent":"queued"}});send.disabled=false}
    next(null,dataUrl?"تم إرسال دليلك للمعلم. أحسنت!":"أحسنت على تنفيذ المهمة.");
  };
  const skip=button("✅ فعلتُها — أكمل","primary");skip.onclick=()=>{event("real_world_task",{payload:{evidence:"not_provided"}});next(null,"ممتاز. نكمل الآن.")};
  const actions=document.createElement("div");actions.className="actions";actions.append(choose,skip);
  box.append(input,preview,actions,send);stageEl.appendChild(box);
}
function bridgeStage(){
  head("من الأشياء إلى الرمز","شاهد: ٤ أشياء، اسمها «أربعة»، ونكتبها ٤.");
  const b=document.createElement("div");b.className="bridge";b.innerHTML='<div class="dots">● ● ● ●</div><div class="word">أربعة</div><div class="hero" style="font-size:115px;margin:6px">٤</div>';

  shuffle(["٣","٤","٥"]).forEach(v=>{const b=button(v,"choice");b.style.fontSize="55px";b.onclick=()=>v==="٤"?next("symbol","نعم! هذا هو ٤."):markWrong(b,"تذكّر: أربع نقاط يقابلها الرمز ٤.");g.appendChild(b)});

function nameStage(){
  head("ما اسمه؟","ما اسم الرمز ٤؟");
  const h=document.createElement("div");h.className="hero";h.textContent="٤";
  const g=document.createElement("div");g.className="grid3";
  shuffle(["ثلاثة","أربعة","خمسة"]).forEach(v=>{const b=button(v);b.onclick=()=>v==="أربعة"?next("name","صحيح! اسم ٤ هو «أربعة»."):markWrong(b,"قل: أربعة. ثم اختر الكلمة الصحيحة.");g.appendChild(b)});
  stageEl.append(h,g);

function traceStage(){
  head("اكتب ٤","تتبّع شكل ٤ بإصبعك ببطء.");
  const note=document.createElement("div");note.className="small";note.textContent="ارسم فوق الشكل الرمادي. سيصل رسمك إلى المعلم عند الضغط على «أنهيت».";
  const box=document.createElement("div");box.className="trace";const guide=document.createElement("div");guide.className="guide";guide.textContent="٤";
  const canvas=document.createElement("canvas");canvas.width=700;canvas.height=420;box.append(guide,canvas);
  const ctx=canvas.getContext("2d");ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#7651d4";ctx.lineWidth=16;
  let drawing=false,last=null,len=0;
  const p=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};
  canvas.onpointerdown=e=>{drawing=true;last=p(e);canvas.setPointerCapture(e.pointerId)};
  canvas.onpointermove=e=>{if(!drawing)return;const q=p(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();len+=Math.hypot(q.x-last.x,q.y-last.y);last=q};
  canvas.onpointerup=()=>{drawing=false;last=null};canvas.onpointercancel=canvas.onpointerup;
  const clear=button("امسح","secondary");clear.onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);len=0};
  const done=button("أنهيت","primary");done.onclick=async()=>{
    if(len<350){markWrong(done,"أكمل رسم شكل ٤ أولًا.");return}
    const dataUrl=canvas.toDataURL("image/png");
    await uploadEvidence(dataUrl,"trace","رسم العدد ٤ بالإصبع");
    event("trace_complete",{correct:true,payload:{strokeLength:Math.round(len)}});next("trace","أحسنت! أرسلت رسمك للمعلم.");
  };
  const a=document.createElement("div");a.className="actions";a.append(clear,done);stageEl.append(note,box,a);
}
const finals=[
 {q:"كم نجمة ترى؟",show:"⭐ ⭐ ⭐ ⭐",opts:["٣","٤","٥"],a:"٤"},
 {q:"أي مجموعة فيها ٤؟",show:"",opts:["● ● ●","● ● ● ●","● ●"],a:"● ● ● ●"},
 {q:"ما العدد الذي يأتي بعد ٣؟",show:"١  ←  ٢  ←  ٣  ←  □",opts:["٢","٤","٥"],a:"٤"},
 {q:"ما اسم الرمز ٤؟",show:"٤",opts:["ثلاثة","أربعة","خمسة"],a:"أربعة"}
];
function finalStage(){
  if(finalIndex>=finals.length){step=13;event("lesson_complete",{correct:true});render();return}
  const q=finals[finalIndex];head("تحدي النهاية",q.q);
  if(q.show){const s=document.createElement("div");s.className=q.show==="٤"?"hero":"center bigicon";s.textContent=q.show;stageEl.appendChild(s)}
  const g=document.createElement("div");g.className="grid3";shuffle(q.opts).forEach(v=>{
    const b=button(v);b.onclick=()=>{if(v===q.a){event("final_answer",{correct:true,payload:{question:finalIndex}});ok("صحيح!");setTimeout(()=>{finalIndex++;render()},450)}
      else{event("final_answer",{correct:false,payload:{question:finalIndex}});markWrong(b,"فكّر مرة أخرى.");}};g.appendChild(b)
  });stageEl.appendChild(g);
}

async function restartLesson(btn){
  if(btn)btn.disabled=true;
  try{narrator.pause()}catch{}
  const r=await post("/api/sessions",{alias,lessonId});
  if(!r){
    if(btn)btn.disabled=false;
    no("تعذر بدء جولة جديدة الآن. حاول مرة أخرى عند وجود الإنترنت.");
    return;
  }
  sessionId=r.session.id;
  localStorage.setItem("dt_session_"+lessonId,sessionId);
  mastery={count:0,make:0,match:0,quantity:0,sequence:0,symbol:0,name:0,trace:0};
  finalIndex=0;attempts=0;firstTry=true;selected=new Set();locked=false;step=1;
  localStorage.setItem("dt_step_"+lessonId,"1");
  event("replay_started",{payload:{source:"completion"}});
  render();
}
function arcadeStage(){
  try{narrator.pause()}catch{}
  titleEl.textContent="لعبة أركيد ٤";
  instEl.textContent="اضرب الهدف الذي يحمل ٤ نجوم فقط.";
  msgEl.textContent="";msgEl.className="msg";bar.style.width="100%";
  stageEl.innerHTML="";
  let score=0,round=0,busy=false;
  const wrap=document.createElement("div");wrap.className="arcadeWrap";
  const title=document.createElement("div");title.className="arcadeTitle";title.textContent="🚀 مهمة الصاروخ ٤";
  const hud=document.createElement("div");hud.className="arcadeHud";
  const scoreEl=document.createElement("div");scoreEl.className="arcadeScore";scoreEl.textContent="الإصابات: ٠ / ٤";
  const help=document.createElement("div");help.className="small";help.style.color="#d8eaff";help.textContent="اضغط الهدف الصحيح";
  hud.append(scoreEl,help);
  const screen=document.createElement("div");screen.className="arcadeScreen";
  const ship=document.createElement("div");ship.className="arcadeShip";ship.textContent="🚀";screen.appendChild(ship);
  const under=document.createElement("div");under.className="msg";under.style.color="#fff";under.style.minHeight="36px";
  const actions=document.createElement("div");actions.className="replayRow";
  const back=button("⬅ العودة للإنجاز","secondary");back.onclick=()=>{step=13;render()};
  const again=button("🔁 ابدأ اللعبة من جديد","secondary");
  actions.append(back,again);
  wrap.append(title,hud,screen,under,actions);stageEl.appendChild(wrap);
  audioIndex=14;playAudio(14);event("arcade_start",{payload:{game:"number4-retro"}});

  function wave(){
    busy=false;under.textContent="";
    [...screen.querySelectorAll(".alien")].forEach(x=>x.remove());
    const counts=shuffle([3,4,5]);
    const lefts=["3%","35%","67%"];
    counts.forEach((count,idx)=>{
      const t=document.createElement("button");t.type="button";t.className="alien";t.style.left=lefts[idx];
      t.setAttribute("aria-label","هدف فيه "+ar(count)+" نجوم");
      t.innerHTML="<div>"+Array(count).fill("⭐").join(" ")+"</div>";
      t.onclick=()=>{
        if(busy)return;
        if(count===4){
          busy=true;score++;round++;retroTone(760,.10);setTimeout(()=>retroTone(980,.09),90);
          t.classList.add("goodTarget","arcadeFlash");
          scoreEl.textContent="الإصابات: "+ar(score)+" / ٤";
          under.textContent="إصابة صحيحة! ⭐";
          event("arcade_hit",{correct:true,payload:{score,round}});
          if(score>=4){
            setTimeout(win,520);
          }else{
            setTimeout(wave,620);
          }
        }else{
          retroTone(180,.13,"sawtooth");under.textContent="ليس ٤. عدّ النجوم ثم حاول.";
          t.classList.add("arcadeFlash");event("arcade_hit",{correct:false,payload:{chosen:count,score}});
          setTimeout(()=>t.classList.remove("arcadeFlash"),450);
        }
      };
      screen.appendChild(t);
    });
  }
  function win(){
    [...screen.querySelectorAll(".alien")].forEach(x=>x.remove());
    ship.style.display="none";
    screen.innerHTML='<div class="arcadeWin">⭐ ⭐ ⭐ ⭐<br>فزت!<br><span style="font-size:22px">عرفتَ العدد ٤</span></div>';
    under.textContent="أربع إصابات صحيحة!";
    event("arcade_complete",{correct:true,payload:{score:4}});
    audioIndex=15;playAudio(15);
  }
  again.onclick=()=>{score=0;round=0;scoreEl.textContent="الإصابات: ٠ / ٤";ship.style.display="";screen.innerHTML="";screen.appendChild(ship);event("arcade_restart");wave()};
  wave();
}
function doneStage(){
  head("أحسنت يا بطل!","أنهيت درس العدد ٤.");
  bar.style.width="100%";
  const d=document.createElement("div");d.className="done";d.innerHTML='<div class="bigicon">🎉 🏆 🎉</div><div class="hero" style="font-size:110px">٤</div><div>أعرف العدد ٤ ⭐<br>أعدّ ٤ أشياء.<br>أكوّن مجموعة من ٤.<br>أعرف أن بعد ٣ يأتي ٤.<br>أعرف الرمز ٤ وكلمة «أربعة».<br>وأكتب ٤ بإصبعي.</div><div class="small" style="margin-top:14px">إعداد: محمد غنام</div>';
  const row=document.createElement("div");row.className="replayRow";
  const replay=button("🔁 أعد الدرس","primary");replay.onclick=()=>restartLesson(replay);
  const arcade=button("🎮 لعبة أركيد ٤","secondary");arcade.onclick=arcadeStage;
  row.append(replay,arcade);d.appendChild(row);
  stageEl.appendChild(d);audioIndex=13;setTimeout(()=>playAudio(13),120);
}
$("listenBtn").onclick=()=>playAudio(audioIndex);
render();flush();
})();
