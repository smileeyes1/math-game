<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>لوحة المعلّم — محمد غنام</title>
<style>
:root{--navy:#102a43;--blue:#2f6fbe;--bg:#f3f7fa;--card:#fff;--line:#dce5ec;--muted:#677b8c;--ok:#16784a;--warn:#9a6900;--bad:#b43c3c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#183247}
body{direction:rtl;text-align:right}
button,input{font:inherit}
header{background:linear-gradient(135deg,#102a43,#1e5277);color:#fff;padding:18px}
.head{max-width:1120px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:25px}.sub{opacity:.83;font-size:13px;margin-top:4px}
main{max-width:1120px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 8px 24px rgba(16,42,67,.06)}
.login{max-width:430px;margin:60px auto}.login h2{text-align:center}
input{width:100%;border:2px solid #cbd9e4;border-radius:14px;padding:12px 13px;outline:none;margin:7px 0}
input:focus{border-color:#6a9fd1;box-shadow:0 0 0 3px #e2f0ff}
button{border:0;border-radius:13px;padding:10px 14px;font-weight:900;cursor:pointer}
.primary{background:#2f6fbe;color:#fff}.soft{background:#eaf3fc;color:#245d96}.danger{background:#fff0f0;color:#a93636}.ok{background:#e8f8ef;color:#16784a}.warn{background:#fff6db;color:#8a6100}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar button{flex:none}
.grid{display:grid;grid-template-columns:360px 1fr;gap:12px;align-items:start}
.list{display:grid;gap:8px;max-height:75vh;overflow:auto;padding-left:3px}
.session{border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;cursor:pointer}
.session:hover,.session.active{border-color:#73a5d4;background:#f8fbff}
.session .name{font-weight:900;font-size:18px}.meta{font-size:13px;color:var(--muted);line-height:1.7}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:900;margin-left:4px}
.b-active{background:#edf5ff;color:#245d96}.b-done{background:#eaf8ef;color:#16784a}.b-follow{background:#fff0df;color:#8a5900}
.progress{height:8px;background:#e8edf1;border-radius:99px;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:#4e91cc}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.detail h2{margin:0 0 8px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.fact{background:#f7fafc;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.fact b{display:block;font-size:22px;margin-top:4px}
.mastery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.skill{border:1px solid var(--line);border-radius:13px;padding:9px}.skill strong{display:block;margin-bottom:4px}.m2{background:#ebf9f1}.m1{background:#fff8e4}.m0{background:#f7f9fb}
.summary{border-right:5px solid #6ea1cf;background:#f0f7fd;border-radius:13px;padding:11px 13px;line-height:1.8;margin:12px 0}
.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ev{border:1px solid var(--line);border-radius:15px;padding:9px}.ev img{width:100%;max-height:300px;object-fit:contain;background:#f5f7f8;border-radius:11px}
.ev .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.ev .actions button{flex:1}
.timeline{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.event{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f4;font-size:13px}
.event .time{color:var(--muted)}
.top-actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 14px}
.msg{min-height:24px;font-size:13px;font-weight:900}.msg.bad{color:var(--bad)}.msg.good{color:var(--ok)}
.hidden{display:none!important}
@media(max-width:820px){.grid{grid-template-columns:1fr}.list{max-height:none}.facts{grid-template-columns:repeat(2,1fr)}.mastery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.evidence{grid-template-columns:1fr}.event{grid-template-columns:85px 1fr}}
@media print{header,.toolbar,.list,.top-actions,.ev .actions{display:none!important}.grid{display:block}.detail{box-shadow:none;border:0}.evidence{grid-template-columns:repeat(2,1fr)}body{background:#fff}}
</style>
</head>
<body>
<header><div class="head"><div><h1>لوحة المعلّم — محمد غنام</h1><div class="sub">متابعة التعلّم والأدلة التي يرسلها الطالب بإرادته</div></div><div id="liveState">● متابعة مباشرة</div></div></header>
<main>
<section id="loginBox" class="card login">
  <h2>دخول المعلّم</h2>
  <p class="meta" style="text-align:center">هذه اللوحة خاصة بالمعلم ولا تظهر للطالب.</p>
  <input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور المعلّم">
  <button id="loginBtn" class="primary" style="width:100%;margin-top:6px">دخول</button>
  <div id="loginMsg" class="msg"></div>
</section>

<section id="app" class="hidden">
  <div class="toolbar">
    <button id="allBtn" class="soft">كل الطلاب</button>
    <button id="followBtn" class="warn">يحتاج متابعة</button>
    <button id="shareBtn" class="ok">شارك رابط الدرس</button>
    <button id="refreshBtn" class="soft">تحديث</button>
    <button id="logoutBtn" class="danger">خروج</button>
  </div>
  <div class="grid">
    <aside class="card">
      <div style="font-weight:900;margin-bottom:8px">الجلسات</div>
      <div id="sessions" class="list"></div>
    </aside>
    <section id="detail" class="card detail"><div class="empty">اختر طالبًا لعرض تقدمه.</div></section>
  </div>
</section>
</main>
<script>
(()=>{"use strict";
const E="٠١٢٣٤٥٦٧٨٩",ar=n=>String(n).replace(/[0-9]/g,d=>E[Number(d)]);
const $=id=>document.getElementById(id);
let sessions=[],currentId="",filter="all",stream=null;
function fmtDate(v){if(!v)return"—";try{return new Intl.DateTimeFormat("ar-EG",{dateStyle:"short",timeStyle:"short"}).format(new Date(v)).replace(/[0-9]/g,d=>E[Number(d)])}catch{return"—"}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url,opt={}){
 const r=await fetch(url,{credentials:"same-origin",...opt,headers:{"Content-Type":"application/json",...(opt.headers||{})}});
 if(r.status===401){showLogin();throw new Error("unauthorized")}
 if(!r.ok)throw new Error("http");
 return r.headers.get("content-type")?.includes("json")?r.json():r;
}
function showLogin(){$("loginBox").classList.remove("hidden");$("app").classList.add("hidden")}
function showApp(){$("loginBox").classList.add("hidden");$("app").classList.remove("hidden");connectStream();loadSessions()}
$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="";
 try{const r=await api("/api/teacher/login",{method:"POST",body:JSON.stringify({password:$("password").value})});if(r.ok)showApp()}
 catch{$("loginMsg").textContent="كلمة المرور غير صحيحة أو تعذر الاتصال."; $("loginMsg").className="msg bad"}
};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
$("logoutBtn").onclick=async()=>{try{await api("/api/teacher/logout",{method:"POST",body:"{}"})}catch{};if(stream)stream.close();showLogin()};
$("refreshBtn").onclick=loadSessions;
$("allBtn").onclick=()=>{filter="all";renderList()};
$("followBtn").onclick=()=>{filter="follow";renderList()};
$("shareBtn").onclick=async()=>{
 const url=location.origin+"/lesson/number-4";
 const data={title:"درس العدد ٤ — المعلّم الرقمي محمد غنام",text:"افتح درس العدد ٤ وابدأ المهمة:",url};
 try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);alert("تم نسخ رابط الدرس")}}catch{}
};
function needsFollow(s){return Number(s.error_count||0)>=3||Number(s.pending_evidence||0)>0||(s.status!=="completed"&&Date.now()-new Date(s.updated_at).getTime()>24*60*60*1000)}
async function loadSessions(){
 try{const r=await api("/api/teacher/sessions");sessions=r.sessions||[];renderList();if(currentId&&sessions.some(s=>s.id===currentId))loadDetail(currentId)}
 catch{}
}
function renderList(){
 const box=$("sessions");box.innerHTML="";
 const list=sessions.filter(s=>filter==="all"||needsFollow(s));
 if(!list.length){box.innerHTML='<div class="empty">لا توجد جلسات في هذا الفلتر.</div>';return}
 for(const s of list){
  const d=document.createElement("div");d.className="session"+(s.id===currentId?" active":"");
  const follow=needsFollow(s)?'<span class="badge b-follow">يحتاج متابعة</span>':"";
  const status=s.status==="completed"?'<span class="badge b-done">مكتمل</span>':'<span class="badge b-active">قيد العمل</span>';
  d.innerHTML='<div class="name">'+esc(s.alias)+'</div><div>'+status+follow+'</div><div class="progress"><span style="width:'+Number(s.progress||0)+'%"></span></div><div class="meta">التقدم: '+ar(s.progress||0)+'٪ • الأخطاء: '+ar(s.error_count||0)+' • الأدلة: '+ar(s.evidence_count||0)+'<br>آخر نشاط: '+fmtDate(s.updated_at)+'</div>';
  d.onclick=()=>{currentId=s.id;renderList();loadDetail(s.id)};box.appendChild(d)
 }
}
const names={count:"العد حتى ٤",make:"تكوين مجموعة من ٤",match:"المطابقة واحدًا لواحد",quantity:"تمييز الكمية ٤",symbol:"ربط الكمية بالرمز ٤",name:"اسم العدد «أربعة»",trace:"كتابة ٤"};
function masteryText(m){
 const low=Object.entries(names).filter(([k])=>Number(m?.[k]||0)<2).map(([,v])=>v);
 const strong=Object.entries(names).filter(([k])=>Number(m?.[k]||0)>=2).map(([,v])=>v);
 if(!strong.length)return"ما زالت البيانات قليلة؛ يحتاج الطالب إلى إكمال مزيد من مراحل الدرس.";
 if(!low.length)return"أظهر الطالب إتقانًا قويًا في جميع مهارات الدرس التي تم قياسها.";
 return"أظهر إتقانًا جيدًا في "+strong.slice(0,3).join("، ")+"، ويحتاج متابعة إضافية في "+low.slice(0,2).join(" و ")+".";
}
async function loadDetail(id){
 const box=$("detail");box.innerHTML='<div class="empty">جارٍ تحميل التقدم…</div>';
 try{
  const r=await api("/api/teacher/sessions/"+id);const s=r.session,m=s.mastery||{},ev=r.evidence||[],events=r.events||[];
  let skills=Object.entries(names).map(([k,v])=>{const x=Number(m[k]||0);return'<div class="skill m'+x+'"><strong>'+v+'</strong>'+(x>=2?"متقن من محاولة قوية":x===1?"أنجز بعد دعم أو إعادة":"لم يثبت بعد")+'</div>'}).join("");
  let evidence=ev.length?ev.map(x=>'<div class="ev"><img loading="lazy" src="/api/teacher/evidence/'+x.id+'" alt="دليل الطالب"><div class="meta">'+esc(x.caption||"دليل تعلم")+'<br>الحالة: '+(x.review_status==="accepted"?"مقبول":x.review_status==="rejected"?"يحتاج إعادة":"بانتظار المراجعة")+' • '+fmtDate(x.created_at)+'</div><div class="actions"><button class="ok" onclick="reviewEvidence(\''+x.id+'\',\'accepted\')">قبول</button><button class="warn" onclick="reviewEvidence(\''+x.id+'\',\'rejected\')">إعادة</button><button class="danger" onclick="deleteEvidence(\''+x.id+'\')">حذف</button></div></div>').join(""):'<div class="empty">لم يرسل الطالب صورًا أو رسومات بعد.</div>';
  let timeline=events.slice(-30).reverse().map(x=>'<div class="event"><div class="time">'+fmtDate(x.created_at)+'</div><div><b>'+eventLabel(x.event_type)+'</b> • '+esc(x.stage||"")+(x.correct===false?' <span style="color:#b43c3c">— محاولة غير صحيحة</span>':x.correct===true?' <span style="color:#16784a">— صحيح</span>':'')+'</div></div>').join("");
  const err=events.filter(x=>x.correct===false).length;
  box.innerHTML='<h2>'+esc(s.alias)+'</h2><div class="meta">الدرس: العدد ٤ • بدأ: '+fmtDate(s.created_at)+' • آخر نشاط: '+fmtDate(s.updated_at)+'</div>'+
   '<div class="top-actions"><button class="soft" onclick="window.print()">طباعة التقرير</button><button class="danger" onclick="deleteSession(\''+s.id+'\')">حذف الجلسة وكل أدلتها</button></div>'+
   '<div class="facts"><div class="fact">التقدم<b>'+ar(s.progress||0)+'٪</b></div><div class="fact">المحاولات غير الصحيحة<b>'+ar(err)+'</b></div><div class="fact">الأدلة<b>'+ar(ev.length)+'</b></div><div class="fact">الحالة<b style="font-size:16px">'+(s.status==="completed"?"مكتمل":"قيد العمل")+'</b></div></div>'+
   '<div class="summary">'+esc(masteryText(m))+'</div><h3>الإتقان</h3><div class="mastery">'+skills+'</div><h3>الأدلة المرسلة</h3><div class="evidence">'+evidence+'</div><div class="timeline"><h3>آخر التفاعلات</h3>'+timeline+'</div>';
 }catch{box.innerHTML='<div class="empty">تعذر تحميل الجلسة.</div>'}
}
function eventLabel(x){return({stage_view:"دخل المرحلة",answer:"أجاب",stage_complete:"أكمل المرحلة",object_selected:"اختار عنصرًا",hint:"استخدم تلميحًا",real_world_task:"نفّذ مهمة واقعية",evidence_uploaded:"أرسل دليلًا",trace_complete:"أكمل الكتابة",final_answer:"أجاب تحدي النهاية",lesson_complete:"أنهى الدرس"})[x]||x}
window.reviewEvidence=async(id,status)=>{try{await api("/api/teacher/evidence/"+id+"/review",{method:"POST",body:JSON.stringify({status})});loadDetail(currentId);loadSessions()}catch{}};
window.deleteEvidence=async id=>{if(!confirm("حذف هذا الدليل نهائيًا من جلسة الطالب؟"))return;try{await api("/api/teacher/evidence/"+id,{method:"DELETE"});loadDetail(currentId);loadSessions()}catch{}};
window.deleteSession=async id=>{if(!confirm("سيُحذف تقدم الطالب وكل الصور والرسومات المرتبطة بهذه الجلسة. هل أنت متأكد؟"))return;try{await api("/api/teacher/sessions/"+id,{method:"DELETE"});currentId="";$("detail").innerHTML='<div class="empty">اختر طالبًا لعرض تقدمه.</div>';loadSessions()}catch{}};
function connectStream(){
 if(stream)stream.close();stream=new EventSource("/api/teacher/stream");
 stream.onopen=()=>{$("liveState").textContent="● متابعة مباشرة";$("liveState").style.opacity="1"};
 stream.onmessage=()=>loadSessions();
 ["session","event","evidence","evidence_review","evidence_deleted","session_deleted"].forEach(n=>stream.addEventListener(n,()=>loadSessions()));
 stream.onerror=()=>{$("liveState").textContent="○ إعادة اتصال…";$("liveState").style.opacity=".7"}
}
(async()=>{try{const r=await api("/api/teacher/me");if(r.ok)showApp()}catch{showLogin()}})();
})();
</script>
</body>
</html>
